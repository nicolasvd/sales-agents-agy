<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}} — {{COMPANY_NAME}}</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --accent: #0ea5e9;
      --accent-light: #e0f2fe;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --email: #4f46e5;
      --email-light: #eef2ff;
      --linkedin: #0077b5;
      --linkedin-light: #e0f2fe;
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.07), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-subtle: #334155;
        --surface-2: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --border: #334155;
        --border-subtle: #1e293b;
        --primary: #60a5fa;
        --primary-light: rgba(96, 165, 250, 0.15);
        --primary-border: rgba(96, 165, 250, 0.3);
        --accent: #38bdf8;
        --accent-light: rgba(56, 189, 248, 0.15);
        --success: #34d399;
        --success-bg: rgba(16, 185, 129, 0.18);
        --success-border: rgba(52, 211, 153, 0.3);
        --warning: #fbbf24;
        --warning-bg: rgba(245, 158, 11, 0.18);
        --warning-border: rgba(251, 191, 36, 0.3);
        --danger: #f87171;
        --danger-bg: rgba(239, 68, 68, 0.18);
        --danger-border: rgba(248, 113, 113, 0.3);
        --email: #a5b4fc;
        --email-light: rgba(99, 102, 241, 0.2);
        --linkedin: #38bdf8;
        --linkedin-light: rgba(56, 189, 248, 0.2);
        --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.35), 0 1px 2px -1px rgba(0, 0, 0, 0.25);
        --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.45), 0 4px 6px -4px rgba(0, 0, 0, 0.25);
      }
      details[open] summary.touch-summary { background: var(--surface-subtle) !important; }
      .message-content { background: var(--surface-subtle) !important; border-color: var(--border-subtle) !important; color: var(--text) !important; }
      .step-pill { background: var(--surface-subtle) !important; color: var(--text-muted) !important; }
      .trigger-tag { background: rgba(56, 189, 248, 0.15) !important; color: #38bdf8 !important; border-color: rgba(56, 189, 248, 0.3) !important; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); line-height: 1.5; padding: 2.5rem 1.5rem; -webkit-font-smoothing: antialiased; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem 2rem; margin-bottom: 1.5rem; box-shadow: var(--card-shadow); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1.5rem; }
    .header-info h1 { font-size: 1.75rem; font-weight: 700; color: var(--text); }
    .header-info p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }

    .nav-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
    }
    .btn-back:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .triggers-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--card-shadow); }
    .triggers-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text); }
    .trigger-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .trigger-tag { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.8125rem; font-weight: 600; }
    
    /* Foldable Email / LinkedIn Cards */
    details.touch-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1rem; box-shadow: var(--card-shadow); overflow: hidden; }
    summary.touch-summary { padding: 1rem 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 0.9375rem; background: var(--surface); color: var(--text); list-style: none; user-select: none; border-bottom: 1px solid transparent; }
    details[open] summary.touch-summary { border-bottom-color: var(--border); background: var(--surface-subtle); }
    summary::-webkit-details-marker { display: none; }
    .touch-left { display: flex; align-items: center; gap: 0.75rem; }
    .step-pill { background: #f1f5f9; color: #475569; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .channel-tag-email { background: var(--email-light); color: var(--email); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .channel-tag-linkedin { background: var(--linkedin-light); color: var(--linkedin); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .touch-body { padding: 1.25rem 1.5rem; }
    .subject-line { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border); }
    .subject-line strong { color: var(--text); }
    .message-content { background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 1.25rem; font-family: var(--font-mono); font-size: 0.875rem; white-space: pre-wrap; line-height: 1.6; color: var(--text); }
    .anchor-note { margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-muted); font-style: italic; }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-copy:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
    }
    .btn-copy.copied {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .badge-na {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--surface-subtle);
      color: var(--text-muted);
      border: 1px dashed var(--border);
    }

    @media print {
      @page { margin: 12mm 15mm; size: A4; }
      body { background: #fff; padding: 0; color: #000; }
      details.touch-card { break-inside: avoid; border: 1px solid #cbd5e1; margin-bottom: 1.5rem; }
      details.touch-card[open] { display: block; }
      details:not([open]) { display: block; }
      details:not([open]) .touch-body { display: block; }
      .nav-actions, .btn-back, .btn-copy { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-info">
        <h1>{{TITLE}} — {{COMPANY_NAME}}</h1>
        <p>Target Contact: {{CONTACT_NAME}} ({{CONTACT_TITLE}}) | Access Readiness: {{CONTACT_SCORE}}/100 | Sequence Generated: {{DATE}}</p>
      </div>
      <nav class="nav-actions">
        <a href="markdown/OUTREACH-SEQUENCE.md" class="btn-back" style="font-family: monospace; font-size: 0.8em; opacity: 0.75;">📄 Markdown</a>
        <a href="../index.html" class="btn-back">← Back to Portal</a>
      </nav>
    </header>

    <section class="triggers-card">
      <h3>🎯 Priority Trigger Events</h3>
      <div class="trigger-tags">
        {{TRIGGER_TAGS_HTML}}
      </div>
    </section>

    <!-- 5-Touch Omnichannel Sequence -->
    <div class="touches-list">
      {{TOUCHES_HTML}}
    </div>
  </div>

  <script>
    function copyText(btn, text) {
      if (!navigator.clipboard) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          markCopied(btn);
        } catch(e) {}
        document.body.removeChild(ta);
        return;
      }
      navigator.clipboard.writeText(text).then(function() {
        markCopied(btn);
      }).catch(function(err) {
        console.error('Failed to copy: ', err);
      });
    }

    function markCopied(btn) {
      var orig = btn.innerHTML;
      btn.innerHTML = '✓ Copié';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
      }, 2000);
    }
  </script>
</body>
</html>
