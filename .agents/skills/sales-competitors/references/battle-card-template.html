<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objection Playbook & Battle Cards — {{COMPANY_NAME}}</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-2: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --accent: #0ea5e9;
      --accent-light: #e0f2fe;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-light: #ecfdf5;
      --success-border: #a7f3d0;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --warning-light: #fffbeb;
      --warning-border: #fde68a;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-light: #fef2f2;
      --danger-border: #fecaca;
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.07), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-subtle: #334155;
        --surface-2: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --border: #334155;
        --border-subtle: #1e293b;
        --primary: #60a5fa;
        --primary-light: rgba(96, 165, 250, 0.15);
        --primary-border: rgba(96, 165, 250, 0.3);
        --accent: #38bdf8;
        --accent-light: rgba(56, 189, 248, 0.15);
        --success: #34d399;
        --success-bg: rgba(16, 185, 129, 0.18);
        --success-border: rgba(52, 211, 153, 0.3);
        --warning: #fbbf24;
        --warning-bg: rgba(245, 158, 11, 0.18);
        --warning-border: rgba(251, 191, 36, 0.3);
        --danger: #f87171;
        --danger-bg: rgba(239, 68, 68, 0.18);
        --danger-border: rgba(248, 113, 113, 0.3);
        --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.35), 0 1px 2px -1px rgba(0, 0, 0, 0.25);
        --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.45), 0 4px 6px -4px rgba(0, 0, 0, 0.25);
      }
      .real-meaning { background: var(--surface-subtle) !important; color: var(--text) !important; }
      .script-proof { background: rgba(16, 185, 129, 0.15) !important; border-color: rgba(52, 211, 153, 0.3) !important; color: #6ee7b7 !important; }
      .arc-a { background: rgba(16, 185, 129, 0.15) !important; border-color: rgba(52, 211, 153, 0.3) !important; color: #6ee7b7 !important; }
      .arc-a .arc-pill { background: #059669 !important; color: #ecfdf5 !important; }
      .arc-r { background: rgba(245, 158, 11, 0.15) !important; border-color: rgba(251, 191, 36, 0.3) !important; color: #fde68a !important; }
      .arc-r .arc-pill { background: #d97706 !important; color: #fffbeb !important; }
      .arc-c { background: rgba(59, 130, 246, 0.15) !important; border-color: rgba(96, 165, 250, 0.3) !important; color: #93c5fd !important; }
      .arc-c .arc-pill { background: #2563eb !important; color: #eff6ff !important; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1040px; margin: 0 auto; }
    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-info h1 { font-size: 1.75rem; font-weight: 800; color: var(--text); }
    .header-info p { color: var(--text-muted); font-size: 0.9375rem; margin-top: 0.35rem; }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
    }
    .btn-back:hover { background: var(--primary-light); border-color: var(--primary-border); color: var(--primary); transform: translateY(-1px); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
    }
    .card h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem; color: var(--text); }
    .objection-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1.25rem;
      padding: 1.25rem;
    }
    .real-meaning {
      background: var(--surface-subtle);
      border-left: 4px solid var(--text-muted);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: var(--text);
    }
    .script-box { border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; font-size: 0.875rem; }
    .script-proof { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
    .arc-steps { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
    .arc-step { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; line-height: 1.5; }
    .arc-pill { flex-shrink: 0; font-size: 0.6875rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.55rem; border-radius: 9999px; margin-top: 0.15rem; }
    .arc-a { background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; }
    .arc-a .arc-pill { background: #6ee7b7; color: #065f46; }
    .arc-r { background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; }
    .arc-r .arc-pill { background: #fcd34d; color: #78350f; }
    .arc-c { background: #eff6ff; border: 1px solid #93c5fd; color: #1e3a8a; }
    .arc-c .arc-pill { background: #93c5fd; color: #1e3a8a; }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-copy:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary);
    }
    .btn-copy.copied {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .badge-na {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--surface-subtle);
      color: var(--text-muted);
      border: 1px dashed var(--border);
    }

    @media print {
      body { padding: 0; background: #fff; color: #000; }
      .container { max-width: 100%; }
      .btn-back, .btn-copy { display: none !important; }
      .card, .objection-card { box-shadow: none; border: 1px solid #cbd5e1; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-info">
        <h1>{{PLAYBOOK_TITLE}}</h1>
        <p>{{COMPANY_NAME}} — {{THEME}} | Generated on {{DATE}}</p>
      </div>
      <nav class="nav-actions">
        <a href="../index.html" class="btn-back">← Back to Portal</a>
      </nav>
    </header>
    <section class="card">
      <h2>A-R-C Playbook</h2>
      {{OBJECTIONS_CONTENT}}
    </section>
  </div>

  <script>
    function copyText(btn, text) {
      if (!navigator.clipboard) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          markCopied(btn);
        } catch(e) {}
        document.body.removeChild(ta);
        return;
      }
      navigator.clipboard.writeText(text).then(function() {
        markCopied(btn);
      }).catch(function(err) {
        console.error('Failed to copy: ', err);
      });
    }

    function markCopied(btn) {
      var orig = btn.innerHTML;
      btn.innerHTML = '✓ Copié';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
      }, 2000);
    }
  </script>
</body>
</html>
